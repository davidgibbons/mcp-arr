name: Release

# Builds the Docker image (-> GHCR) and the GitHub Release on every version tag.
#
# This fork publishes a container image only — there is no npm package, and
# package.json is "private": true. Everything here uses the per-run,
# auto-expiring GITHUB_TOKEN; the project stores no long-lived registry token.
#
# Release flow (normal): release-please maintains a release PR from the
# conventional commits on main. Merging it bumps package.json + CHANGELOG,
# tags, and cuts the GitHub Release - then release-please.yml CALLS this
# workflow to build the image.
#
# It calls rather than relying on the tag push because a tag created by a
# workflow using GITHUB_TOKEN does not trigger other workflows. Wiring the two
# together directly avoids needing a stored PAT purely to defeat that.
#
# The tag trigger below remains for a hand-cut tag, and workflow_dispatch for
# a manual re-run.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.6.4) — must match package.json and exist in CHANGELOG.md'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to build, without the leading v. The tag must already exist.'
        required: true
        type: string
      skip_github_release:
        description: 'Skip cutting a GitHub Release - release-please already made one.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  # ── 1. Validate & prepare ───────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # may create + push the tag on workflow_dispatch
    outputs:
      tag:     ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      major:   ${{ steps.version.outputs.major }}
      minor:   ${{ steps.version.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed to inspect existing tags

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A called workflow inherits the caller's event_name and ref, so the
          # ref is useless for identifying the release - an explicit input is
          # the only reliable signal. Prefer it whenever it is set.
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          fi

          # Strict semver guard — protects the tag, the changelog match, and image tags.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not a valid x.y.z semver string."
            exit 1
          fi

          # package.json must already be bumped to this version.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release version ($VERSION). Bump package.json first."
            exit 1
          fi

          # CHANGELOG.md must carry a matching section.
          if ! grep -Eq "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::No '## [${VERSION}]' section found in CHANGELOG.md."
            exit 1
          fi

          # On manual dispatch, create + push the tag if missing; if it exists it must point at HEAD.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              if [ "$(git rev-parse "$TAG")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::Tag $TAG already exists and does not point at HEAD. Aborting."
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              git push origin "$TAG"
            fi
          fi

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${MAJOR}.${REST%.*}"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
            echo "minor=${MINOR}"
          } >> "$GITHUB_OUTPUT"

  # ── 2. Build & test gate ────────────────────────────────────────────────────
  build-test:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: node --test

  # ── 3. Docker image -> GHCR ─────────────────────────────────────────────────
  docker:
    needs: [prepare, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ needs.prepare.outputs.major }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=mcp-arr
            org.opencontainers.image.description=MCP server for the *arr media management suite
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. GitHub Release ───────────────────────────────────────────────────────
  github-release:
    needs: [prepare, build-test]
    # release-please cuts its own Release; cutting a second one here would
    # either fail or overwrite its notes.
    if: ${{ inputs.skip_github_release != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Extract changelog notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "::error::Empty release notes extracted for ${VERSION}."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
