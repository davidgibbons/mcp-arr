# Ready-to-run Compose file for self-hosting mcp-arr in remote HTTP mode
# (e.g. for n8n). Pulls the published image from GHCR.
#
# SECURITY: the default below binds the container to all interfaces
# (HOST=0.0.0.0) and maps port 3000 on the host, and the MCP endpoint is
# unauthenticated unless you configure MCP_ARR_AUTH_MODE. Two ways to close it:
#
#   token  MCP_ARR_AUTH_TOKEN           require `Authorization: Bearer <token>`
#          MCP_ARR_AUTH_TOKEN_READONLY  a second token that can only read
#          Generate them with `openssl rand -hex 32`.
#
#   oauth  MCP_ARR_OAUTH_ISSUER    your IdP, e.g. Authentik or Keycloak
#          MCP_ARR_OAUTH_AUDIENCE  the `aud` this server accepts
#          Validates JWTs itself and reads read/write access off their scopes.
#
# Without either, keep this on a trusted/LAN network or behind an authenticating
# reverse proxy - do NOT expose port 3000 directly to the public internet. To
# restrict host access to localhost only, change the port mapping to
# "127.0.0.1:3000:3000".
#
# To limit the blast radius of whoever can reach it, set MCP_ARR_ACCESS=read-only
# below: the 24 tools that add media, trigger downloads, delete queue items or
# approve requests are then neither advertised nor callable.
#
# Supply your *arr URLs and API keys via a .env file next to this compose file.

services:
  mcp-arr:
    image: ghcr.io/davidgibbons/mcp-arr:latest
    container_name: mcp-arr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # HTTP transport mode
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      MCP_PATH: /mcp
      # Set to read-only to drop the 24 mutating tools.
      MCP_ARR_ACCESS: ${MCP_ARR_ACCESS:-read-write}
      # Uncomment ONE of the two blocks below to close the endpoint.
      # A static bearer token:
      # MCP_ARR_AUTH_TOKEN: ${MCP_ARR_AUTH_TOKEN:-}
      # MCP_ARR_AUTH_TOKEN_READONLY: ${MCP_ARR_AUTH_TOKEN_READONLY:-}
      # Or OAuth 2.1 against your own identity provider:
      # MCP_ARR_AUTH_MODE: oauth
      # MCP_ARR_OAUTH_ISSUER: ${MCP_ARR_OAUTH_ISSUER:-}
      # MCP_ARR_OAUTH_AUDIENCE: ${MCP_ARR_OAUTH_AUDIENCE:-}
      # Sonarr
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      # Radarr
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      # Lidarr
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      # Prowlarr
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      # Whisparr
      WHISPARR_URL: ${WHISPARR_URL:-}
      WHISPARR_API_KEY: ${WHISPARR_API_KEY:-}
      # Chaptarr
      CHAPTARR_URL: ${CHAPTARR_URL:-}
      CHAPTARR_API_KEY: ${CHAPTARR_API_KEY:-}
      # Jellyseerr
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      # Bazarr
      BAZARR_URL: ${BAZARR_URL:-}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
