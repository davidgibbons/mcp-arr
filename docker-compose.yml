# Ready-to-run Compose file for self-hosting mcp-arr in remote HTTP mode
# (e.g. for n8n). Pulls the published image from GHCR.
#
# SECURITY: the HTTP MCP endpoint is UNAUTHENTICATED. The default below binds the
# container to all interfaces (HOST=0.0.0.0) and maps port 3000 on the host.
# Keep this on a trusted/LAN network or behind an authenticating reverse proxy —
# do NOT expose port 3000 directly to the public internet. To restrict host access
# to localhost only, change the port mapping to "127.0.0.1:3000:3000".
#
# To limit the blast radius of whoever can reach it, set MCP_ARR_ACCESS=read-only
# below: the 24 tools that add media, trigger downloads, delete queue items or
# approve requests are then neither advertised nor callable.
#
# Supply your *arr URLs and API keys via a .env file next to this compose file.

services:
  mcp-arr:
    image: ghcr.io/davidgibbons/mcp-arr:latest
    container_name: mcp-arr
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # HTTP transport mode
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      MCP_PATH: /mcp
      # Set to read-only to drop the 24 mutating tools.
      MCP_ARR_ACCESS: ${MCP_ARR_ACCESS:-read-write}
      # Sonarr
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      # Radarr
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      # Lidarr
      LIDARR_URL: ${LIDARR_URL:-}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      # Prowlarr
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      # Whisparr
      WHISPARR_URL: ${WHISPARR_URL:-}
      WHISPARR_API_KEY: ${WHISPARR_API_KEY:-}
      # Chaptarr
      CHAPTARR_URL: ${CHAPTARR_URL:-}
      CHAPTARR_API_KEY: ${CHAPTARR_API_KEY:-}
      # Jellyseerr
      JELLYSEERR_URL: ${JELLYSEERR_URL:-}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
      # Bazarr
      BAZARR_URL: ${BAZARR_URL:-}
      BAZARR_API_KEY: ${BAZARR_API_KEY:-}
